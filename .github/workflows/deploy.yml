name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish the current default branch from the Actions tab without
  # waiting for a push.
  workflow_dispatch:

# Allow one deployment at a time, and let a newer push supersede a queued one
# rather than cancelling a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # vite.config.ts defaults the base path to /sxsguide/, which is where a
      # project site is served from. Set BASE_PATH here if you move it.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
